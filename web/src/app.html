<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="stylesheet" href="https://use.typekit.net/jdj2bxb.css" />
    <script>
      // Apply the theme before first paint so there's no flash.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            localStorage.setItem("theme", t);
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-primary text-primary-paragraph antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
